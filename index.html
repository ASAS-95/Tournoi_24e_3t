<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASAS • Tournoi 24 équipes</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#14263c;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#0d2548,#164a70);color:white;padding:25px max(18px,calc((100vw - 1150px)/2))}header h1{margin:0;font-size:28px}header p{opacity:.82;margin:8px 0 0}main{max-width:1150px;margin:22px auto;padding:0 16px}.panel{background:white;border:1px solid #dce4ef;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 3px 14px #10253d0b}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button{border:0;border-radius:9px;background:#1764a2;color:white;padding:10px 14px;font-weight:650;cursor:pointer}button:hover{filter:brightness(.93)}button.secondary{background:#e8eef5;color:#183752}button.danger{background:#a52f42}button:disabled{opacity:.45;cursor:not-allowed}.tabs button{background:#e2eaf3;color:#26445f}.tabs button.active{background:#1764a2;color:white}h2{margin:0 0 14px;font-size:20px}h3{margin:14px 0 9px}p{line-height:1.5}.muted{color:#5f7085;font-size:13px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}input,select{border:1px solid #c8d5e4;border-radius:8px;padding:9px;background:white;font:inherit;max-width:100%}input[type=number]{width:60px;text-align:center}input[type=text]{width:100%}.teamgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:9px}.teamfield{display:flex;align-items:center;gap:8px}.teamfield span{min-width:25px;color:#6c7d90}.teamfield input{min-width:0}.pill{display:inline-block;padding:4px 9px;background:#e7f2fa;border-radius:20px;font-size:12px;color:#195b88}.matches{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.match{border:1px solid #dbe5f0;border-radius:12px;padding:13px}.match .meta{font-size:12px;color:#637991;margin-bottom:9px}.scoreline{display:grid;grid-template-columns:1fr 53px 16px 53px 1fr;gap:5px;align-items:center;text-align:center}.scoreline strong{font-size:13px;overflow-wrap:anywhere}.scoreline input{width:53px;padding:7px 3px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:10px;border-bottom:1px solid #e6ebf1;text-align:left}th{background:#f0f5fa}td.num,th.num{text-align:center}.scroll{overflow-x:auto}.notice{padding:11px 13px;background:#fff4d8;border-radius:9px;color:#755300;margin:10px 0}.ok{background:#e2f4e9;color:#246340}.stat{font-size:30px;font-weight:800;color:#1764a2}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stats>div{background:#edf5fc;padding:15px;border-radius:12px}@media(max-width:650px){.stats{grid-template-columns:1fr}.scoreline{grid-template-columns:1fr 42px 10px 42px 1fr}.scoreline input{width:42px}.panel{padding:13px}header h1{font-size:23px}}</style></head><body><header><h1>⚽ ASAS — Tournoi 24 équipes</h1><p>3 terrains • 6 aires de jeu • Classement suisse et résultats</p></header><main><div class="tabs" id="tabs"></div><div id="app"></div></main><script>
const KEY='asas-tournoi-v1';const courts=['Herbe 1 · A','Herbe 1 · B','Herbe 2 · A','Herbe 2 · B','Synthétique · A','Synthétique · B'];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const defaultState=()=>({teams:Array.from({length:24},(_,i)=>'Équipe '+(i+1)),rounds:[],tab:'accueil',finals:null});let state;try{state=JSON.parse(localStorage.getItem(KEY))||defaultState();if(!Array.isArray(state.teams)||state.teams.length!==24)throw Error()}catch{state=defaultState()}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function setTab(t){state.tab=t;save();render()}function completed(m){return Number.isInteger(m.aScore)&&Number.isInteger(m.bScore)&&m.aScore>=0&&m.bScore>=0}function standings(){let rows=state.teams.map((name,id)=>({id,name,pts:0,p:0,w:0,d:0,l:0,gf:0,ga:0,opp:[]}));for(const r of state.rounds)for(const m of r){if(!completed(m))continue;const a=rows[m.a],b=rows[m.b];a.p++;b.p++;a.gf+=m.aScore;a.ga+=m.bScore;b.gf+=m.bScore;b.ga+=m.aScore;a.opp.push(b.id);b.opp.push(a.id);if(m.aScore>m.bScore){a.pts+=3;a.w++;b.l++}else if(m.aScore<m.bScore){b.pts+=3;b.w++;a.l++}else{a.pts++;b.pts++;a.d++;b.d++}}return rows.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.id-b.id)}function played(a,b){return state.rounds.some(r=>r.some(m=>(m.a===a&&m.b===b)||(m.a===b&&m.b===a)))}function pairing(ids){ // Backtracking prioritizes adjacent ranks, avoids repeats.
 const rec=(remaining)=>{if(!remaining.length)return [];let a=remaining[0];for(let i=1;i<remaining.length;i++){let b=remaining[i];if(played(a,b))continue;let tail=rec(remaining.slice(1,i).concat(remaining.slice(i+1)));if(tail)return [[a,b],...tail]}return null};return rec(ids)}
function newRound(){if(state.rounds.length>=5){alert('5 journées maximum avant les phases finales.');return}if(state.rounds.length&&state.rounds.at(-1).some(m=>!completed(m))){alert('Saisissez tous les résultats de la journée précédente.');return}const ids=state.rounds.length?standings().map(r=>r.id):state.teams.map((_,i)=>i).sort(()=>Math.random()-.5);let pairs=pairing(ids);if(!pairs){alert('Impossible de générer des rencontres sans doublon.');return}const round=pairs.map(([a,b],i)=>({a,b,court:i%6,wave:Math.floor(i/6)+1,aScore:null,bScore:null}));state.rounds.push(round);save();setTab('matchs')}
function score(round,index,side,value){const m=state.rounds[round][index];m[side]=value===''?null:Math.max(0,Math.floor(Number(value)));state.finals=null;save();render(false)}function changeTeam(i,v){state.teams[i]=v;save()}function reset(){if(!confirm('Effacer toutes les équipes, rencontres et résultats ?'))return;state=defaultState();save();render()}function deleteLast(){if(!state.rounds.length)return;if(!confirm('Supprimer la dernière journée et ses résultats ?'))return;state.rounds.pop();state.finals=null;save();render()}
function createFinals(){if(state.rounds.length!==5||state.rounds.some(r=>r.some(m=>!completed(m)))){alert('Terminez les 5 journées suisses avant les phases finales.');return}const top=standings().slice(0,8).map(x=>x.id);state.finals={qf:[[top[0],top[7]],[top[3],top[4]],[top[1],top[6]],[top[2],top[5]]].map(([a,b])=>({a,b,aScore:null,bScore:null})),sf:[],f:[]};save();render()}
function finalWinner(m){if(!completed(m)||m.aScore===m.bScore)return null;return m.aScore>m.bScore?m.a:m.b}function nextFinal(stage){const ms=state.finals[stage];if(ms.some(m=>finalWinner(m)===null)){alert('Tous les matchs doivent avoir un vainqueur. En cas d’égalité, saisissez le score après départage aux tirs au but.');return}const next=stage==='qf'?'sf':'f';state.finals[next]=[];for(let i=0;i<ms.length;i+=2)state.finals[next].push({a:finalWinner(ms[i]),b:finalWinner(ms[i+1]),aScore:null,bScore:null});save();render()}function finalScore(stage,i,side,value){state.finals[stage][i][side]=value===''?null:Math.max(0,Math.floor(Number(value)));if(stage==='qf'){state.finals.sf=[];state.finals.f=[]}if(stage==='sf')state.finals.f=[];save();render(false)}
function render(focus=true){document.getElementById('tabs').innerHTML=[['accueil','Tableau de bord'],['equipes','Équipes'],['matchs','Rencontres'],['classement','Classement'],['finales','Phase finale']].map(([id,n])=>`<button class="${state.tab===id?'active':''}" onclick="setTab('${id}')">${n}</button>`).join('');const app=document.getElementById('app');if(state.tab==='accueil'){let count=state.rounds.flat().filter(completed).length;app.innerHTML=`<section class="panel"><h2>Bienvenue au tournoi ASAS</h2><div class="stats"><div><div class="stat">24</div>équipes</div><div><div class="stat">6</div>aires de jeu simultanées</div><div><div class="stat">${count}/60</div>matchs suisses terminés</div></div><p>Chaque journée comprend <b>12 matchs</b> sur <b>2 vagues de 6 matchs</b>. Les adversaires sont rapprochés selon le classement après chaque journée, sans revanche.</p><p class="muted">Configuration : Herbe 1 (A/B), Herbe 2 (A/B), Synthétique (A/B). 5 journées puis quarts, demi-finales et finale.</p><div class="row"><button onclick="setTab('equipes')">1. Renseigner les équipes</button><button onclick="setTab('matchs')" class="secondary">2. Gérer les matchs</button></div></section><section class="panel"><h2>Important : sauvegarde</h2><div class="notice">Cette version enregistre les données <b>dans ce navigateur uniquement</b>. Les résultats ne se synchronisent pas entre plusieurs téléphones. Exportez régulièrement une sauvegarde JSON. Pour une gestion multi-administrateurs en direct, une base de données et une authentification seront nécessaires.</div><div class="row"><button onclick="exportData()">Exporter une sauvegarde</button><label class="pill">Importer une sauvegarde <input type="file" accept="application/json" onchange="importData(event)" style="max-width:180px"></label><button class="danger" onclick="reset()">Réinitialiser</button></div></section>`}
if(state.tab==='equipes'){app.innerHTML=`<section class="panel"><h2>Les 24 équipes</h2><p class="muted">Les noms peuvent être modifiés à tout moment. Pour modifier la composition du tournoi, réinitialisez les rencontres.</p><div class="teamgrid">${state.teams.map((n,i)=>`<label class="teamfield"><span>${i+1}.</span><input type="text" maxlength="60" value="${esc(n)}" oninput="changeTeam(${i},this.value)"></label>`).join('')}</div><p><button onclick="setTab('matchs')">Passer aux rencontres →</button></p></section>`}
if(state.tab==='matchs'){app.innerHTML=`<section class="panel"><div class="row space"><h2>Journées suisses (${state.rounds.length}/5)</h2><div class="row"><button ${state.rounds.length>=5?'disabled':''} onclick="newRound()">+ Générer la journée suivante</button><button class="secondary" onclick="deleteLast()">Supprimer la dernière</button></div></div><p class="muted">Les scores sont enregistrés automatiquement. Chaque vague utilise les 6 aires de jeu. Terminez une journée pour générer la suivante.</p></section>${state.rounds.map((round,r)=>`<section class="panel"><h2>Journée ${r+1}</h2>${[1,2].map(w=>`<h3>Vague ${w}</h3><div class="matches">${round.map((m,i)=>m.wave===w?matchHtml(m,r,i):'').join('')}</div>`).join('')}</section>`).join('')}`}
if(state.tab==='classement'){let rows=standings();app.innerHTML=`<section class="panel"><h2>Classement général</h2><p class="muted">3 points victoire • 1 point nul • 0 défaite. Départage : différence de buts, puis buts marqués, puis ordre initial. Les critères peuvent être adaptés.</p><div class="scroll"><table><thead><tr><th>Rang</th><th>Équipe</th>${['Pts','MJ','G','N','P','BP','BC','Diff.'].map(x=>`<th class="num">${x}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.name)}</b> ${i<8?'<span class="pill">Top 8</span>':''}</td>${[r.pts,r.p,r.w,r.d,r.l,r.gf,r.ga,r.gf-r.ga].map(v=>`<td class="num">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}
if(state.tab==='finales'){app.innerHTML=`<section class="panel"><h2>Phase finale — 8 qualifiés</h2><p class="muted">Les 8 premiers après les 5 journées accèdent aux quarts de finale. En cas d’égalité, renseignez le score final après départage (ex. tirs au but).</p>${!state.finals?`<button onclick="createFinals()">Créer les quarts de finale</button>`:finalsHtml()}</section>`}if(focus)window.scrollTo({top:0,behavior:'instant'})}
function matchHtml(m,r,i){return `<div class="match"><div class="meta">${esc(courts[m.court])} · Match ${i+1}</div><div class="scoreline"><strong>${esc(state.teams[m.a])}</strong><input aria-label="Score équipe A" type="number" min="0" value="${m.aScore??''}" onchange="score(${r},${i},'aScore',this.value)"><span>–</span><input aria-label="Score équipe B" type="number" min="0" value="${m.bScore??''}" onchange="score(${r},${i},'bScore',this.value)"><strong>${esc(state.teams[m.b])}</strong></div></div>`}
function finalsHtml(){let f=state.finals;return [['qf','Quarts de finale'],['sf','Demi-finales'],['f','Finale']].map(([stage,label])=>`<h3>${label}</h3>${!f[stage].length?'<p class="muted">En attente de la phase précédente.</p>':`<div class="matches">${f[stage].map((m,i)=>`<div class="match"><div class="meta">${label} ${i+1}</div><div class="scoreline"><strong>${esc(state.teams[m.a])}</strong><input type="number" min="0" value="${m.aScore??''}" onchange="finalScore('${stage}',${i},'aScore',this.value)"><span>–</span><input type="number" min="0" value="${m.bScore??''}" onchange="finalScore('${stage}',${i},'bScore',this.value)"><strong>${esc(state.teams[m.b])}</strong></div></div>`).join('')}</div>`}${stage!=='f'&&f[stage].length&&!f[stage==='qf'?'sf':'f'].length?`<p><button onclick="nextFinal('${stage}')">Valider et générer la suite →</button></p>`:''}${stage==='f'&&f.f.length&&finalWinner(f.f[0])!==null?`<div class="notice ok">🏆 Champion : <b>${esc(state.teams[finalWinner(f.f[0])])}</b></div>`:''}`).join('')}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='asas-tournoi-sauvegarde.json';a.click();URL.revokeObjectURL(a.href)}function importData(ev){let file=ev.target.files[0];if(!file)return;file.text().then(s=>{try{let x=JSON.parse(s);if(!Array.isArray(x.teams)||x.teams.length!==24||!Array.isArray(x.rounds))throw Error();if(!confirm('Remplacer les données actuelles par cette sauvegarde ?'))return;state=x;save();render()}catch{alert('Fichier de sauvegarde invalide.')}})}render();
</script></body></html>
