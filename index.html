'use strict';
const KEY='montmorency-tournoi-v4',V3='montmorency-tournoi-v3',PREV='montmorency-tournoi-v2',OLD='asas-tournoi-v1';
const defaultCourts=['Synthé 1','Synthé 2','Herbe 3','Herbe 4','Herbe 5','Herbe 6'];
const defaults=()=>({teamCount:24,courtCount:6,syntheticCount:2,roundCount:5,groupMinutes:12,quarterMinutes:15,semiMinutes:15,placementMinutes:15,finalHalfMinutes:10,finalTwoHalves:true,halftimeMinutes:5,rotationMinutes:3,finalRotationMinutes:5,start:'09:30',pauseMinutes:90,minRestMinutes:15});
const cfg=()=>state.config;
const courts=()=>Array.from({length:cfg().courtCount},(_,i)=>i<cfg().syntheticCount?'Synthé '+(i+1):'Herbe '+(i+1));
const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+'h'+String(m%60).padStart(2,'0');
const startMinutes=()=>{const [h,m]=cfg().start.split(':').map(Number);return h*60+m};
const groupSlot=()=>cfg().groupMinutes+cfg().rotationMinutes;
const groupWaves=()=>Math.ceil(cfg().teamCount/2/cfg().courtCount);
const groupEnd=()=>startMinutes()+cfg().roundCount*groupWaves()*groupSlot();
const finalStart=()=>groupEnd()+cfg().pauseMinutes;
const duration=id=>id==='first'?(cfg().finalTwoHalves?cfg().finalHalfMinutes*2+cfg().halftimeMinutes:cfg().finalHalfMinutes):id[0]==='q'?cfg().quarterMinutes:id[0]==='w'?cfg().semiMinutes:cfg().placementMinutes;
const stageSlot=id=>duration(id)+cfg().finalRotationMinutes;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({clubLogo:null,clubColor:'#a51434',version:4,config:defaults(),title:'FC Montmorency — Tournoi U12',teams:Array.from({length:24},(_,i)=>'Équipe '+(i+1)),logos:Array(24).fill(null),rounds:[],finals:null,tab:'accueil'});
let state;try{state=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(V3)||localStorage.getItem(PREV)||localStorage.getItem(OLD))||fresh();if(!Array.isArray(state.teams)||state.teams.length<8||!Array.isArray(state.rounds))throw Error('invalide')}catch{state=fresh()}
function normalize(){state.clubColor=/^#[0-9a-fA-F]{6}$/.test(state.clubColor||'')?state.clubColor:'#a51434';state.clubLogo=typeof state.clubLogo==='string'&&state.clubLogo.startsWith('data:image/')?state.clubLogo:null;state.version=4;state.config={...defaults(),...(state.config||{})};state.config.teamCount=state.teams.length;state.config.courtCount=Math.max(2,Math.min(12,Number(state.config.courtCount)||6));state.config.syntheticCount=Math.max(2,Math.min(state.config.courtCount,Number(state.config.syntheticCount)||2));state.title=state.title||'FC Montmorency — Tournoi U12';state.logos=Array.from({length:state.teams.length},(_,i)=>state.logos?.[i]||null);if(!['accueil','equipes','matchs','classement','finales','planning','parametres'].includes(state.tab))state.tab='accueil';if(state.finals&&!state.finals.leagues)state.finals=null;}
normalize();function save(){schedulePublish();try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Stockage saturé : exportez votre tournoi et réduisez la taille des logos.')}}
const logo=id=>state.logos[id]?`<img class="logo" alt="" src="${esc(state.logos[id])}">`:'';
const team=id=>id===null||id===undefined?'<em>À déterminer</em>':`<span class="teamname">${logo(id)}<span>${esc(state.teams[id])}</span></span>`;
const valid=m=>Number.isInteger(m.aScore)&&Number.isInteger(m.bScore)&&m.aScore>=0&&m.bScore>=0;
function ranking(){const rows=state.teams.map((name,id)=>({id,name,pts:0,p:0,w:0,d:0,l:0,gf:0,ga:0}));for(const round of state.rounds)for(const m of round){if(!valid(m))continue;const a=rows[m.a],b=rows[m.b];a.p++;b.p++;a.gf+=m.aScore;a.ga+=m.bScore;b.gf+=m.bScore;b.ga+=m.aScore;if(m.aScore>m.bScore){a.pts+=3;a.w++;b.l++}else if(m.aScore<m.bScore){b.pts+=3;b.w++;a.l++}else{a.pts++;b.pts++;a.d++;b.d++}}return rows.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.id-b.id)}
const played=(a,b)=>state.rounds.some(r=>r.some(m=>(m.a===a&&m.b===b)||(m.a===b&&m.b===a)));
function pairTeams(ids){const rec=left=>{if(!left.length)return [];const a=left[0];for(let i=1;i<left.length;i++){if(played(a,left[i]))continue;const tail=rec(left.slice(1,i).concat(left.slice(i+1)));if(tail)return [[a,left[i]],...tail]}return null};return rec(ids)}
function newRound(){if(state.finals){alert('Les phases finales ont été créées. Réinitialisez-les avant de modifier les journées.');return}if(state.rounds.length>=cfg().roundCount)return alert(cfg().roundCount+' journées maximum.');if(state.rounds.length&&state.rounds.at(-1).some(m=>!valid(m)))return alert('Terminez la journée précédente.');const ids=state.rounds.length?ranking().map(r=>r.id):state.teams.map((_,i)=>i);if(!state.rounds.length)for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}let pairs=pairTeams(ids);if(!pairs)return alert('Aucun appariement sans revanche trouvé.');const rank=new Map(ranking().map((r,i)=>[r.id,i]));pairs.sort((a,b)=>Math.min(...a.map(x=>rank.get(x)))-Math.min(...b.map(x=>rank.get(x))));state.rounds.push(pairs.map(([a,b],i)=>({a,b,court:i%cfg().courtCount,wave:Math.floor(i/cfg().courtCount)+1,aScore:null,bScore:null})));save();render()}
function editRound(r,i,side,val){const m=state.rounds[r][i];m[side]=val===''?null:Math.max(0,Math.floor(Number(val)));save();render(false)}
function deleteRound(){if(!state.rounds.length||state.finals)return;if(!confirm('Supprimer la dernière journée ?'))return;state.rounds.pop();save();render()}
const groupDefsAll=[{key:'or',name:'OR',offset:0,cls:'gold'},{key:'argent',name:'ARGENT',offset:8,cls:'silver'},{key:'bronze',name:'BRONZE',offset:16,cls:'bronze'},{key:'cuivre',name:'CUIVRE',offset:24,cls:'bronze'}];let groupDefs=groupDefsAll.slice(0,Math.floor(cfg().teamCount/8));
function makeLeague(def,ranked){const q=ranked.slice(def.offset,def.offset+8);const pairs=[[q[0],q[7]],[q[3],q[4]],[q[1],q[6]],[q[2],q[5]]];const out={};pairs.forEach(([a,b],i)=>out['q'+i]={a,b,aScore:null,bScore:null,pa:null,pb:null});for(const id of ['w0','w1','l0','l1','first','third','fifth','seventh'])out[id]={a:null,b:null,aScore:null,bScore:null,pa:null,pb:null};return out}
function createFinals(){if(state.rounds.length!==cfg().roundCount||state.rounds.some(r=>r.some(m=>!valid(m))))return alert('Il faut terminer toutes les journées de classement.');if(state.finals&&!confirm('Recréer les phases finales et effacer leurs résultats ?'))return;const ids=ranking().map(x=>x.id);state.finals={lockedRanks:ids,leagues:Object.fromEntries(groupDefs.map(d=>[d.key,makeLeague(d,ids)]))};syncFinals();save();state.tab='finales';render()}
function winner(m){if(!m||m.a===null||m.b===null||!valid(m))return null;if(m.aScore!==m.bScore)return m.aScore>m.bScore?m.a:m.b;if(Number.isInteger(m.pa)&&Number.isInteger(m.pb)&&m.pa!==m.pb)return m.pa>m.pb?m.a:m.b;return null}
function loser(m){const w=winner(m);return w===null?null:(w===m.a?m.b:m.a)}
function setEntrants(l,id,a,b){const m=l[id];if(m.a!==a||m.b!==b){m.a=a;m.b=b;m.aScore=null;m.bScore=null;m.pa=null;m.pb=null}}
function syncFinals(){if(!state.finals)return;for(const d of groupDefs){const l=state.finals.leagues[d.key];if(!l)continue;setEntrants(l,'w0',winner(l.q0),winner(l.q1));setEntrants(l,'w1',winner(l.q2),winner(l.q3));setEntrants(l,'l0',loser(l.q0),loser(l.q1));setEntrants(l,'l1',loser(l.q2),loser(l.q3));setEntrants(l,'first',winner(l.w0),winner(l.w1));setEntrants(l,'third',loser(l.w0),loser(l.w1));setEntrants(l,'fifth',winner(l.l0),winner(l.l1));setEntrants(l,'seventh',loser(l.l0),loser(l.l1))}}
function editFinal(group,id,field,value){const m=state.finals?.leagues[group]?.[id];if(!m||m.a===null||m.b===null)return;m[field]=value===''?null:Math.max(0,Math.floor(Number(value)));syncFinals();save();render(false)}
function resetFinals(){if(!state.finals||!confirm('Effacer toutes les phases finales et leurs scores ?'))return;state.finals=null;save();render()}
function placement(){if(!state.finals)return null;const arr=Array(cfg().teamCount).fill(null);for(const d of groupDefs){const l=state.finals.leagues[d.key],o=d.offset;const ids=['first','third','fifth','seventh'];ids.forEach((id,k)=>{arr[o+2*k]=winner(l[id]);arr[o+2*k+1]=loser(l[id])})}return arr}
// Chaque entrée représente un match, avec son créneau de début et son terrain.
// Les matchs OR restent sur Synthé 1/2. Les matchs ARGENT sont prioritaires sur les synthétiques libres, sous réserve de ne pas chevaucher les matchs OR suivants.
function buildPlan(){
 const assignments=[],available=Array(cfg().courtCount).fill(finalStart()), last=new Map();
 const possible={};const deps={};
 for(const d of groupDefs){
   const q=Array.from({length:8},(_,i)=>d.offset+i);
   for(let i=0;i<4;i++){const indexes=[[0,7],[3,4],[1,6],[2,5]][i];possible[d.key+':q'+i]=indexes.map(x=>q[x]);deps[d.key+':q'+i]=[]}
   for(const [id,children] of Object.entries({w0:['q0','q1'],w1:['q2','q3'],l0:['q0','q1'],l1:['q2','q3'],first:['w0','w1'],third:['w0','w1'],fifth:['l0','l1'],seventh:['l0','l1']})){
     possible[d.key+':'+id]=[...new Set(children.flatMap(x=>possible[d.key+':'+x]))];deps[d.key+':'+id]=children.map(x=>d.key+':'+x);
   }
 }
 const order=['q0','q2','q1','q3','l0','l1','w0','w1','seventh','fifth','third','first'];
 // Prefer early OR quarters, then ARGENT and BRONZE. The final OR is deliberately last.
 const jobs=[];for(const id of order){for(const d of groupDefs){jobs.push({g:d.key,id,key:d.key+':'+id})}}
 const pending=new Set(jobs.map(j=>j.key));
 while(pending.size){let choice=null;
 for(const j of jobs){if(!pending.has(j.key)||deps[j.key].some(k=>pending.has(k)))continue;
 for(let c=0;c<cfg().courtCount;c++){
 if(j.g==='or'&&c>=cfg().syntheticCount)continue;
 let earliest=available[c];for(const dep of deps[j.key]){const a=assignments.find(x=>x.key===dep);if(a)earliest=Math.max(earliest,a.end+cfg().minRestMinutes)}
 for(const q of possible[j.key])earliest=Math.max(earliest,last.get(q)??finalStart());
 // All possible participants are protected, even before scores are known.
 let conflict=true;while(conflict){conflict=false;for(const a of assignments){if(earliest<a.end&&earliest+stageSlot(j.id)>a.start&&possible[j.key].some(x=>possible[a.key].includes(x))){earliest=a.end+cfg().minRestMinutes;conflict=true}}}
 const candidate={...j,court:c,start:earliest,end:earliest+duration(j.id),occupiedUntil:earliest+stageSlot(j.id)};
 if(!choice||candidate.start<choice.start||(candidate.start===choice.start&&j.g==='or'&&choice.g!=='or'))choice=candidate;
 }
 }
 if(!choice)break;
 assignments.push(choice);pending.delete(choice.key);available[choice.court]=choice.occupiedUntil;
 for(const q of possible[choice.key])last.set(q,Math.max(last.get(q)||0,choice.end+cfg().minRestMinutes));
 }
 return assignments.sort((a,b)=>a.start-b.start||a.court-b.court);
}
const plan=()=>buildPlan();
const clock=slot=>fmt(finalStart()+slot*20);
const stageName=id=>({q0:'Quart 1',q1:'Quart 2',q2:'Quart 3',q3:'Quart 4',w0:'Demi 1',w1:'Demi 2',l0:'Classement A',l1:'Classement B',first:'Finale',third:'3e / 4e',fifth:'5e / 6e',seventh:'7e / 8e'}[id]);
function finalCard(group,id){const m=state.finals.leagues[group][id],ready=m.a!==null&&m.b!==null,won=winner(m),isFinal=id==='first';return `<div class="match ${group==='or'?'gold':group==='argent'?'silver':'bronze'}"><div class="meta">${stageName(id)} ${isFinal?(cfg().finalTwoHalves?'· 2 × '+cfg().finalHalfMinutes+' min':'· '+cfg().finalHalfMinutes+' min'):'· '+duration(id)+' min'} · ${plan().find(p=>p.g===group&&p.id===id)?fmt(plan().find(p=>p.g===group&&p.id===id).start):''}</div><div class="score"><strong>${team(m.a)}</strong><input type="number" min="0" aria-label="Buts domicile" ${!ready?'disabled':''} value="${m.aScore??''}" onchange="editFinal('${group}','${id}','aScore',this.value)"><span>–</span><input type="number" min="0" aria-label="Buts extérieur" ${!ready?'disabled':''} value="${m.bScore??''}" onchange="editFinal('${group}','${id}','bScore',this.value)"><strong>${team(m.b)}</strong></div>${ready&&valid(m)&&m.aScore===m.bScore?`<div class="scoregroup"><label>⚽ TAB extérieur :</label><input type="number" min="0" aria-label="TAB domicile" value="${m.pa??''}" onchange="editFinal('${group}','${id}','pa',this.value)"><span>–</span><input type="number" min="0" aria-label="TAB extérieur" value="${m.pb??''}" onchange="editFinal('${group}','${id}','pb',this.value)"></div>`:''}${won!==null?`<p class="finalnote">✓ Vainqueur : <b>${esc(state.teams[won])}</b></p>`:ready&&valid(m)&&m.aScore===m.bScore?'<p class="finalnote">En attente du résultat des tirs au but sur la zone extérieure.</p>':''}</div>`}
function roundCard(m,r,i){return `<div class="match"><div class="meta">${esc(courts()[m.court])} · Vague ${m.wave} · Match ${i+1} · ${cfg().groupMinutes} min</div><div class="score"><strong>${team(m.a)}</strong><input type="number" min="0" aria-label="Buts domicile" value="${m.aScore??''}" onchange="editRound(${r},${i},'aScore',this.value)"><span>–</span><input type="number" min="0" aria-label="Buts extérieur" value="${m.bScore??''}" onchange="editRound(${r},${i},'bScore',this.value)"><strong>${team(m.b)}</strong></div></div>`}
function setTab(t){state.tab=t;save();render()}
function changeClubColor(v){if(!/^#[0-9a-fA-F]{6}$/.test(v))return;state.clubColor=v;save();applyBrand()}
function applyBrand(){document.documentElement.style.setProperty('--club-color',state.clubColor);document.getElementById('club-logo').src=state.clubLogo||'logo-montmorency.png'}
function uploadClubLogo(input){const f=input.files?.[0];if(!f)return;if(f.type!=='image/png')return alert('Le logo du club doit être au format PNG.');if(f.size>3*1024*1024)return alert('PNG trop volumineux (maximum 3 Mo).');const url=URL.createObjectURL(f),img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=220;const ctx=c.getContext('2d');const r=Math.min(220/img.width,220/img.height);ctx.drawImage(img,(220-img.width*r)/2,(220-img.height*r)/2,img.width*r,img.height*r);state.clubLogo=c.toDataURL('image/png');URL.revokeObjectURL(url);save();applyBrand();render(false)};img.onerror=()=>{URL.revokeObjectURL(url);alert('Image PNG illisible')};img.src=url}
function resetClubLogo(){state.clubLogo=null;save();applyBrand();render(false)}
function changeTitle(v){state.title=v;document.getElementById('brand-title').textContent=v;save()}
function changeTeam(i,v){state.teams[i]=v;save()}
function uploadLogo(i,input){const f=input.files?.[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type))return alert('Choisissez une image PNG, JPG ou WebP.');const url=URL.createObjectURL(f),img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=110;const ctx=c.getContext('2d');const r=Math.min(110/img.width,110/img.height);ctx.drawImage(img,(110-img.width*r)/2,(110-img.height*r)/2,img.width*r,img.height*r);state.logos[i]=c.toDataURL('image/png');URL.revokeObjectURL(url);save();render(false)};img.onerror=()=>{URL.revokeObjectURL(url);alert('Image illisible')};img.src=url}
function removeLogo(i){state.logos[i]=null;save();render(false)}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tournoi-montmorency-v4-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(e){const file=e.target.files?.[0];if(!file)return;try{const x=JSON.parse(await file.text());if(!Array.isArray(x.teams)||x.teams.length<8||!Array.isArray(x.rounds))throw Error();if(!confirm('Remplacer toutes les données actuelles par ce fichier ?'))return;state=x;normalize();groupDefs=groupDefsAll.slice(0,state.config.teamCount/8);syncFinals();save();render()}catch{alert('Sauvegarde JSON invalide.')}}
function saveSettings(){
 const c={...cfg()};for(const k of Object.keys(defaults())){const el=document.getElementById('cfg_'+k);if(!el)continue;c[k]=k==='start'?el.value:k==='finalTwoHalves'?el.value==='true':Number(el.value)}
 if(![8,16,24,32].includes(c.teamCount))return alert('Le nombre d’équipes doit être 8, 16, 24 ou 32 pour former des tableaux de 8.');
 if(c.courtCount<1||c.courtCount>12||c.syntheticCount<1||c.syntheticCount>c.courtCount)return alert('Prévoir de 1 à 12 terrains, dont au moins 1 terrain utilisable pour la ligue OR.');
 if(c.roundCount<1||c.roundCount>=c.teamCount)return alert('Nombre de journées invalide.');
 for(const k of ['groupMinutes','quarterMinutes','semiMinutes','placementMinutes','finalHalfMinutes'])if(!Number.isFinite(c[k])||c[k]<5||c[k]>40)return alert('Durée invalide : '+k);
 for(const k of ['rotationMinutes','finalRotationMinutes','halftimeMinutes','pauseMinutes','minRestMinutes'])if(!Number.isFinite(c[k])||c[k]<0||c[k]>180)return alert('Paramètre invalide : '+k);
 if(!/^\d{2}:\d{2}$/.test(c.start))return alert('Heure de début invalide.');
 const structural=c.teamCount!==cfg().teamCount||c.roundCount!==cfg().roundCount||c.courtCount!==cfg().courtCount;
 if(structural&&(state.rounds.length||state.finals)&&!confirm('Le changement du nombre d’équipes, de terrains ou de journées effacera les rencontres et résultats existants. Exportez d’abord votre JSON. Continuer ?'))return;
 if(structural){state.rounds=[];state.finals=null;state.teams=Array.from({length:c.teamCount},(_,i)=>state.teams[i]||'Équipe '+(i+1));state.logos=Array.from({length:c.teamCount},(_,i)=>state.logos[i]||null)}
 state.config=c;groupDefs=groupDefsAll.slice(0,c.teamCount/8);save();render();alert('Réglages enregistrés. Horaires recalculés.');
}
function reset(){if(!confirm('EFFACER toutes les équipes et tous les résultats ? Exportez d’abord une sauvegarde.'))return;state=fresh();groupDefs=groupDefsAll.slice(0,state.config.teamCount/8);save();render()}
function updateAnnouncement(v){state.announcement=v.slice(0,600);save()}
function render(scroll=true){applyBrand();document.getElementById('brand-title').textContent=state.title;document.getElementById('tabs').innerHTML=[['accueil','Accueil'],['equipes','Équipes'],['matchs','Journées'],['classement','Classement'],['finales','OR / Argent / Bronze'],['planning','Planning'],['parametres','Paramètres'],['diffusion','Diffusion publique']].map(([k,v])=>`<button class="${state.tab===k?'active':''}" onclick="setTab('${k}')">${v}</button>`).join('');const app=document.getElementById('app');let h='';
if(state.tab==='accueil'){const done=state.rounds.flat().filter(valid).length,slots=plan();const last=Math.max(finalStart(),...slots.map(x=>x.end));h=`<section class="panel"><h2>Tableau de bord</h2><div class="stats"><div><b>${cfg().teamCount}</b>équipes</div><div><b>${done}/${cfg().teamCount/2*cfg().roundCount}</b>matchs de classement</div><div><b>${state.finals?slots.filter(x=>winner(state.finals.leagues[x.g][x.id])!==null).length:0}/${slots.length}</b>matchs de phases finales</div></div><p>${cfg().roundCount} journées de ${cfg().groupMinutes} minutes ; phases finales en tableaux de 8 équipes. OR uniquement sur synthétique.</p><div class="notice">Les résultats sont enregistrés uniquement sur cet appareil. Exportez régulièrement une sauvegarde JSON ; aucune synchronisation automatique entre téléphones.</div><div class="actions"><button onclick="setTab('equipes')">Équipes</button><button onclick="setTab('matchs')">Journées</button><button onclick="setTab('planning')">Planning</button><button onclick="setTab('parametres')">Modifier le format</button><button class="secondary" onclick="exportData()">Exporter JSON</button></div></section><section class="panel"><h2>Horaires calculés automatiquement</h2><p><b>${fmt(startMinutes())}–${fmt(groupEnd())}</b> : journées de classement · <b>${fmt(groupEnd())}–${fmt(finalStart())}</b> : pause · <b>${fmt(finalStart())}–${fmt(last)}</b> : phases finales.</p><p class="muted">Fin prévisionnelle des matchs : <b>${fmt(last)}</b>. Les tirs au but extérieurs et les imprévus peuvent retarder cette heure.</p></section>`}
if(state.tab==='equipes')h=`<section class="panel"><h2>Les ${cfg().teamCount} équipes</h2><p class="muted">Q1 désigne le 1er du classement après les ${cfg().roundCount} journées.</p><div class="teamgrid">${state.teams.map((n,i)=>`<div class="teamcard"><div class="row">${logo(i)}<span>${i+1}.</span><input type="text" maxlength="70" value="${esc(n)}" oninput="changeTeam(${i},this.value)"></div><div class="row"><input type="file" accept="image/png,image/jpeg,image/webp" aria-label="Logo équipe ${i+1}" onchange="uploadLogo(${i},this)">${state.logos[i]?`<button class="secondary mini" onclick="removeLogo(${i})">Retirer</button>`:''}</div></div>`).join('')}</div></section>`;
if(state.tab==='matchs'){const times=Array.from({length:cfg().roundCount},(_,r)=>fmt(startMinutes()+r*groupWaves()*groupSlot()));h=`<section class="panel"><div class="row between"><h2>Journées de classement (${state.rounds.length}/${cfg().roundCount})</h2><div class="actions"><button ${state.finals||state.rounds.length>=cfg().roundCount?'disabled':''} onclick="newRound()">+ Journée suivante</button><button class="secondary" ${state.finals?'disabled':''} onclick="deleteRound()">Supprimer dernière</button></div></div><p class="muted">${cfg().groupMinutes} min de jeu + ${cfg().rotationMinutes} min de rotation ; ${groupWaves()} vagues par journée. Aucune revanche pendant les journées.</p></section>${state.rounds.map((round,r)=>`<section class="panel"><h2>Journée ${r+1} · ${times[r]}</h2>${Array.from({length:groupWaves()},(_,wi)=>`<h3>Vague ${wi+1} — ${fmt(startMinutes()+(r*groupWaves()+wi)*groupSlot())}</h3><div class="grid">${round.map((m,i)=>m.wave===wi+1?roundCard(m,r,i):'').join('')}</div>`).join('')}</section>`).join('')}`}
if(state.tab==='classement'){const rows=ranking(),fixed=state.finals?.lockedRanks;h=`<section class="panel"><h2>Classement après les 5 journées</h2><p class="muted">3 points victoire · 1 nul · départage : différence de buts, buts marqués, ordre initial. Les liserés OR/ARGENT/BRONZE suivent le rang. ${fixed?'Les numéros Q sont figés pour les phases finales.':''}</p><div class="scroll"><table><thead><tr><th>Q</th><th>Équipe</th><th>Ligue</th>${['Pts','MJ','G','N','P','BP','BC','Diff.'].map(x=>`<th class="center">${x}</th>`).join('')}</tr></thead><tbody>${(fixed?fixed.map(id=>rows.find(r=>r.id===id)):rows).map((r,i)=>{const d=groupDefs[Math.floor(i/8)]||groupDefs.at(-1);return `<tr class="${d.cls}"><td><b>Q${i+1}</b></td><td>${team(r.id)}</td><td><span class="tag ${d.cls}">${d.name}</span></td>${[r.pts,r.p,r.w,r.d,r.l,r.gf,r.ga,r.gf-r.ga].map(v=>`<td class="center">${v}</td>`).join('')}</tr>`}).join('')}</tbody></table></div></section>`;const places=placement();if(places)h+=`<section class="panel"><h2>Classement final (places 1 à ${cfg().teamCount})</h2><div class="grid">${groupDefs.map(d=>`<div><h3>${d.name}</h3><table>${Array.from({length:8},(_,i)=>`<tr class="${d.cls}"><td>${d.offset+i+1}.</td><td>${places[d.offset+i]===null?'À déterminer':team(places[d.offset+i])}</td></tr>`).join('')}</table></div>`).join('')}</div></section>`}
if(state.tab==='finales'){h=`<section class="panel"><div class="row between"><h2>Phases finales · 3 ligues</h2><div class="actions">${!state.finals?'<button onclick="createFinals()">Créer les 3 tableaux</button>':'<button class="danger" onclick="resetFinals()">Réinitialiser les phases finales</button>'}</div></div><p class="muted">Quarts : ${cfg().quarterMinutes} min ; demi-finales : ${cfg().semiMinutes} min ; classements : ${cfg().placementMinutes} min ; finales : ${cfg().finalTwoHalves?'2 × '+cfg().finalHalfMinutes+' min':'1 × '+cfg().finalHalfMinutes+' min'}${cfg().finalTwoHalves?' + '+cfg().halftimeMinutes+' min de pause':''}. Si égalité, renseigner séparément les tirs au but effectués sur le terrain extérieur.</p>${!state.finals?'<div class="notice">Terminez les 5 journées, puis créez les trois tableaux. La qualification utilise le classement à cet instant.</div>':''}</section>`;if(state.finals)for(const d of groupDefs){h+=`<section class="panel"><h2 class="${d.cls}" style="padding-left:10px">${d.name} · Q${d.offset+1} à Q${d.offset+8}</h2>${[['q0','q1','q2','q3'],['w0','w1','l0','l1'],['first','third','fifth','seventh']].map((ids,k)=>`<h3>${['Quarts de finale','Demi-finales et classement','Finales et places définitives'][k]}</h3><div class="grid">${ids.map(id=>finalCard(d.key,id)).join('')}</div>`).join('')}</section>`}}
if(state.tab==='planning'){const scheduled=plan(),finish=Math.max(finalStart(),...scheduled.map(x=>x.end));h=`<section class="panel"><h2>Planning automatique</h2><p><b>${fmt(startMinutes())}–${fmt(groupEnd())}</b> : ${cfg().roundCount} journées · <b>${fmt(groupEnd())}–${fmt(finalStart())}</b> : pause · <b>${fmt(finalStart())}–${fmt(finish)}</b> : phases finales.</p><p class="muted">Calcul basé sur les terrains disponibles, les durées, les rotations, les dépendances entre matchs et un repos minimum de ${cfg().minRestMinutes} minutes. OR uniquement sur les synthétiques. Le planning peut être plus prudent que nécessaire tant que les qualifiés ne sont pas connus.</p><div class="scroll"><table class="schedule"><thead><tr><th>Heure</th><th>Terrain</th><th>Ligue</th><th>Match</th><th>Durée</th></tr></thead><tbody>${scheduled.map(p=>{const d=groupDefs.find(x=>x.key===p.g),m=state.finals?.leagues[p.g]?.[p.id];return `<tr class="${d.cls}"><td><b>${fmt(p.start)}–${fmt(p.end)}</b></td><td>${esc(courts()[p.court])}</td><td>${d.name}</td><td>${stageName(p.id)} : ${m?`${esc(state.teams[m.a]??'À déterminer')} – ${esc(state.teams[m.b]??'À déterminer')}`:'À définir'}${m&&valid(m)?` · ${m.aScore}–${m.bScore}${m.aScore===m.bScore&&m.pa!==null&&m.pb!==null?` · TAB ${m.pa}–${m.pb}`:''}`:''}</td><td>${duration(p.id)} min</td></tr>`}).join('')}</tbody></table></div><div class="notice">Les tirs au but se déroulent sur le terrain extérieur. Leur durée et leur file d’attente ne sont pas prévisibles ; prévoyez une marge avant les récompenses.</div></section>`}
if(state.tab==='diffusion')h=`<section class="panel"><h2>Diffusion publique · Parents et coachs</h2><p>La page publique est <b>en lecture seule</b>. Elle est accessible sans compte, par lien ou QR code.</p><div class="notice">${liveReady()?'Configuration de diffusion présente. Connectez-vous pour publier.':'Mode démonstration : configurez d’abord le fichier <b>config.js</b> et Supabase pour activer les mises à jour sur tous les téléphones.'}</div><p><a href="direct.html" target="_blank" rel="noopener">Ouvrir la page parents et coachs ↗</a></p><div class="row"><img src="qr-tournoi.png" width="160" height="160" alt="QR code page publique"><div><p><b>QR code à imprimer</b></p><p class="muted">Il ouvre https://tournoi24e3t.vercel.app/direct.html</p><a href="qr-tournoi.png" download>Télécharger le QR code</a></div></div><h3>📣 Annonce organisateur</h3><p class="muted">L’annonce sera visible par les parents et sur la télévision après publication.</p><textarea id="announcementInput" rows="3" maxlength="600" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px" placeholder="Ex. : Les rencontres du terrain 3 reprendront à 14h15.">${esc(state.announcement||'')}</textarea><div class="row"><button onclick="updateAnnouncement(document.getElementById('announcementInput').value);render(false)">Enregistrer l’annonce</button><button onclick="updateAnnouncement('');render(false)">Effacer l’annonce</button></div><p><a href="direct.html?tv=1" target="_blank" rel="noopener">📺 Ouvrir le mode télévision ↗</a></p><h3>Connexion organisateur</h3><p class="muted">La connexion permet de publier les scores sur la base partagée. Les résultats restent modifiables localement sans connexion, mais ne sont alors pas diffusés.</p><div class="row"><input id="liveEmail" type="email" placeholder="E-mail administrateur" autocomplete="username"><input id="livePassword" type="password" placeholder="Mot de passe" autocomplete="current-password"><button onclick="liveLogin()">Se connecter</button><button class="secondary" onclick="liveLogout()">Déconnexion</button></div><p id="liveStatus" class="muted">${esc(liveStatus)}</p><div class="actions"><button onclick="publishNow(true)">Publier maintenant</button><button class="secondary" onclick="pullRemote()">Importer la version publiée</button></div><p class="muted">Une fois connecté, les modifications sont publiées automatiquement après quelques secondes. La publication manuelle est également possible.</p></section>`;
if(state.tab==='parametres')h=`<section class="panel"><h2>Paramètres modifiables</h2><label>Nom du tournoi <input type="text" maxlength="100" value="${esc(state.title)}" oninput="changeTitle(this.value)"></label><h3>Identité du club</h3><div class="row"><img class="logo" style="width:75px;height:75px" src="${esc(state.clubLogo||'logo-montmorency.png')}" alt="Logo actuel"><div><label>Logo PNG <input type="file" accept="image/png" onchange="uploadClubLogo(this)"></label><button class="secondary mini" onclick="resetClubLogo()">Logo par défaut</button></div></div><label>Couleur du club <input type="color" value="${esc(state.clubColor)}" oninput="changeClubColor(this.value)"></label><h3>Format du tournoi</h3><section class="settings-section"><h3>Terrain</h3><p class="muted">Nombre d’équipes, terrains disponibles et nombre de journées.</p><div class="settings-fields"><label>Nombre d’équipes<input type="number" id="cfg_teamCount" min="8" max="32" step="8" value="${cfg().teamCount}"></label><label>Nombre de terrains<input type="number" id="cfg_courtCount" min="1" max="12" step="1" value="${cfg().courtCount}"></label><label>Dont terrains synthétiques<input type="number" id="cfg_syntheticCount" min="1" max="12" step="1" value="${cfg().syntheticCount}"></label><label>Nombre de journées<input type="number" id="cfg_roundCount" min="1" max="31" step="1" value="${cfg().roundCount}"></label></div></section><section class="settings-section"><h3>Durée</h3><p class="muted">Durée des rencontres selon la phase.</p><div class="settings-fields"><label>Phase de classement (min)<input type="number" id="cfg_groupMinutes" min="5" max="40" step="1" value="${cfg().groupMinutes}"></label><label>Quarts de finale (min)<input type="number" id="cfg_quarterMinutes" min="5" max="40" step="1" value="${cfg().quarterMinutes}"></label><label>Demi-finales (min)<input type="number" id="cfg_semiMinutes" min="5" max="40" step="1" value="${cfg().semiMinutes}"></label><label>Matchs de classement (min)<input type="number" id="cfg_placementMinutes" min="5" max="40" step="1" value="${cfg().placementMinutes}"></label></div></section><section class="settings-section"><h3>Pause</h3><p class="muted">Pause déjeuner et récupération des équipes.</p><div class="settings-fields"><label>Pause déjeuner (min)<input type="number" id="cfg_pauseMinutes" min="0" max="180" step="5" value="${cfg().pauseMinutes}"></label><label>Repos minimum (min)<input type="number" id="cfg_minRestMinutes" min="0" max="60" step="5" value="${cfg().minRestMinutes}"></label></div></section><section class="settings-section"><h3>Rotation</h3><p class="muted">Temps entre la fin d’un match et le suivant.</p><div class="settings-fields"><label>Rotation journées (min)<input type="number" id="cfg_rotationMinutes" min="0" max="15" step="1" value="${cfg().rotationMinutes}"></label><label>Rotation phases finales (min)<input type="number" id="cfg_finalRotationMinutes" min="0" max="15" step="1" value="${cfg().finalRotationMinutes}"></label></div></section><section class="settings-section"><h3>Format de la Finale</h3><p class="muted">Choisis une période ou deux mi-temps.</p><div class="settings-fields"><label>Durée finale / période (min)<input type="number" id="cfg_finalHalfMinutes" min="5" max="40" step="1" value="${cfg().finalHalfMinutes}"></label><label>Pause mi-temps (min)<input type="number" id="cfg_halftimeMinutes" min="0" max="15" step="1" value="${cfg().halftimeMinutes}"></label><label>Format de la finale<select id="cfg_finalTwoHalves"><option value="true" ${cfg().finalTwoHalves?'selected':''}>2 mi-temps</option><option value="false" ${!cfg().finalTwoHalves?'selected':''}>1 période</option></select></label></div></section><section class="settings-section"><h3>Début du tournoi</h3><p class="muted">Heure du premier coup d’envoi.</p><div class="settings-fields"><label>Début du tournoi<input id="cfg_start" type="time" value="${cfg().start}"></label></div></section><p class="muted">Formats pris en charge : 8, 16, 24 ou 32 équipes. Les réglages recalculent les horaires. Une modification structurelle peut réinitialiser les rencontres après confirmation.</p><div class="actions"><button onclick="saveSettings()">Enregistrer et recalculer les horaires</button></div><h3>Règles appliquées</h3><ol><li>Une rencontre par équipe et par journée ; aucun adversaire répété pendant la phase de classement.</li><li>Classement : victoire 3 points, nul 1, défaite 0 ; différence de buts, puis buts marqués, puis ordre initial.</li><li>Groupes de huit selon le classement : OR (Q1–Q8), ARGENT (Q9–Q16), BRONZE (Q17–Q24), puis CUIVRE (Q25–Q32) si nécessaire.</li><li>OR exclusivement sur synthétique ; autres ligues sur synthétique ou herbe.</li><li>Quarts : 1–8, 4–5, 2–7, 3–6 dans chaque ligue ; les perdants jouent les places 5–8.</li><li>En cas d’égalité en phase finale, tirs au but sur la zone extérieure. Nuls acceptés en journées.</li><li>Chaque équipe joue trois matchs de phase finale, avec une place finale déterminée.</li><li>Horaires prévisionnels : rotations, pause et temps de récupération pris en compte ; prévoir une marge pour les tirs au but.</li></ol><h3>Sauvegarde JSON</h3><p>La sauvegarde JSON conserve les équipes, les logos, les résultats et les réglages. Elle permet de reprendre un tournoi sur un autre appareil, mais ne synchronise pas les appareils en direct.</p><div class="actions"><button onclick="exportData()">Exporter JSON</button><label class="badge">Importer JSON <input type="file" accept="application/json" onchange="importData(event)"></label><button class="danger" onclick="reset()">Tout réinitialiser</button></div></section>`;
app.innerHTML=h;if(scroll)window.scrollTo(0,0)}

// Supabase: configuration publique (anon key), jamais de cle service_role ici.
const LIVE=window.TOURNOI_LIVE||{};
let liveSession=null,liveStatus='Non connecté';let publishTimer=null,publishing=false;
const liveReady=()=>/^https:\/\//.test(LIVE.url||'')&&!!LIVE.anonKey;
function liveEndpoint(path){return LIVE.url.replace(/\/$/,'')+path}
async function liveRequest(path,opts={}){if(!liveReady())throw Error('Configurez config.js');const headers={'apikey':LIVE.anonKey,'Content-Type':'application/json',...opts.headers};if(liveSession?.access_token)headers.Authorization='Bearer '+liveSession.access_token;const r=await fetch(liveEndpoint(path),{...opts,headers});const body=await r.text();if(!r.ok)throw Error('HTTP '+r.status+' : '+body.slice(0,200));return body?JSON.parse(body):null}
async function liveLogin(){try{const email=document.getElementById('liveEmail').value.trim(),password=document.getElementById('livePassword').value;const r=await liveRequest('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});liveSession=r;liveStatus='Connecté : '+email;render(false);alert('Connexion réussie. Vous pouvez publier le tournoi.')}catch(e){liveStatus=e.message;alert('Connexion impossible : '+e.message)}}
function liveLogout(){liveSession=null;liveStatus='Déconnecté';render(false)}
function schedulePublish(){if(!liveSession||!liveReady())return;clearTimeout(publishTimer);publishTimer=setTimeout(()=>publishNow(false),1300)}
async function publishNow(manual){if(!liveSession){if(manual)alert('Connectez-vous dans Diffusion publique avant de publier.');return}if(publishing)return;publishing=true;try{const payload=JSON.parse(JSON.stringify(state));delete payload.tab;const r=await liveRequest('/rest/v1/tournaments?id=eq.main',{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify({payload,updated_at:new Date().toISOString()})});if(!Array.isArray(r)||r.length!==1)throw Error('Aucun tournoi mis à jour. Vérifiez la configuration SQL et les autorisations.');liveStatus='Dernière publication : '+new Date().toLocaleTimeString('fr-FR');if(manual)alert('Tournoi publié. Les parents verront les nouvelles données.')}catch(e){liveStatus='Publication impossible : '+e.message;if(manual)alert(liveStatus);else console.error(liveStatus)}finally{publishing=false;const el=document.getElementById('liveStatus');if(el)el.textContent=liveStatus}}
async function pullRemote(){if(!liveSession)return alert('Connectez-vous pour importer la version publiée.');if(!confirm('Remplacer le tournoi local par la version publiée ? Exportez un JSON avant.'))return;try{const r=await liveRequest('/rest/v1/tournaments?id=eq.main&select=payload');if(!r?.[0]?.payload)throw Error('Aucune donnée publiée');const x=r[0].payload;if(!Array.isArray(x.teams)||!Array.isArray(x.rounds)||![8,16,24,32].includes(x.teams.length))throw Error('Données invalides');state=x;normalize();groupDefs=groupDefsAll.slice(0,state.config.teamCount/8);save();render();alert('Version publiée importée.')}catch(e){alert('Import impossible : '+e.message)}}
render();
</script></body></html>
