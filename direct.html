<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tournoi FC Montmorency · Direct</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17253b;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#99122f,#231a28);color:white;padding:17px 16px}header .inner{max-width:900px;margin:auto;display:flex;align-items:center;gap:12px}header img{width:58px;height:58px;background:white;border-radius:50%;object-fit:contain;padding:3px}h1{font-size:21px;margin:0}header p{margin:3px 0;font-size:12px;opacity:.85}main{max-width:900px;margin:auto;padding:14px}nav{display:flex;gap:6px;overflow:auto;padding:5px 0 14px}button,select{font:inherit}nav button{white-space:nowrap;border:0;background:#e1e6ee;color:#24354d;padding:10px 13px;border-radius:9px;font-weight:700}nav button.active{background:#99122f;color:white}.panel{background:white;border:1px solid #dce4ed;border-radius:13px;padding:15px;margin-bottom:12px}.match{border-left:5px solid #ac1432;background:#f8fafc;padding:11px;margin:8px 0;border-radius:8px}.gold{border-color:#d5a52c}.silver{border-color:#9ba7b8}.bronze{border-color:#b87b4d}.meta,.muted{font-size:12px;color:#62738a}.line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:5px 0}.team{font-weight:650;min-width:0;overflow-wrap:anywhere}.score{font-weight:800;font-size:18px;white-space:nowrap}.pill{display:inline-block;border-radius:20px;background:#e8f5ee;color:#18673e;padding:4px 9px;font-size:12px;font-weight:700}.warn{background:#fff4dc;color:#7b5311;padding:12px;border-radius:9px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}select{padding:9px;border-radius:9px;border:1px solid #cbd5e1;max-width:100%;flex:1;min-width:170px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 5px;border-bottom:1px solid #e8edf3;text-align:left}td.num,th.num{text-align:right}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:16px 0 8px}footer{text-align:center;padding:18px;color:#68758b;font-size:12px}</style></head><body><header><div class="inner"><img src="logo-montmorency.png" alt="FC Montmorency"><div><h1 id="title">FC Montmorency · Tournoi U12</h1><p>Résultats, terrains et horaires · Lecture seule</p></div></div></header><main><div id="status" class="panel muted">Chargement des résultats…</div><div class="filters"><select id="teamFilter" onchange="draw()"><option value="">Toutes les équipes</option></select></div><nav id="nav"></nav><div id="content"></div></main><footer>Consultation publique · Actualisation automatique toutes les 20 secondes</footer><script src="config.js"></script><script>
'use strict';const LIVE=window.TOURNOI_LIVE||{};let state=null,tab='matchs',lastUpdate=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const valid=m=>Number.isInteger(m?.aScore)&&Number.isInteger(m?.bScore);const time=m=>String(Math.floor(m/60)).padStart(2,'0')+'h'+String(m%60).padStart(2,'0');const groups=[['or','OR','gold'],['argent','ARGENT','silver'],['bronze','BRONZE','bronze'],['cuivre','CUIVRE','bronze']];
function ranking(){const r=state.teams.map((name,id)=>({id,name,p:0,pts:0,gf:0,ga:0}));for(const round of state.rounds||[])for(const m of round){if(!valid(m)||!r[m.a]||!r[m.b])continue;let a=r[m.a],b=r[m.b];a.p++;b.p++;a.gf+=m.aScore;a.ga+=m.bScore;b.gf+=m.bScore;b.ga+=m.aScore;if(m.aScore>m.bScore)a.pts+=3;else if(m.aScore<m.bScore)b.pts+=3;else{a.pts++;b.pts++}}return r.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.id-b.id)}
function card(m,meta,cls=''){const name=id=>id===null||id===undefined?'À déterminer':state.teams[id]||'Équipe';return `<div class="match ${cls}"><div class="meta">${esc(meta)}</div><div class="line"><span class="team">${esc(name(m.a))}</span><span class="score">${valid(m)?m.aScore:'–'}</span></div><div class="line"><span class="team">${esc(name(m.b))}</span><span class="score">${valid(m)?m.bScore:'–'}</span></div>${valid(m)&&m.aScore===m.bScore&&Number.isInteger(m.pa)&&Number.isInteger(m.pb)?`<div class="meta">Tirs au but : ${m.pa} – ${m.pb}</div>`:''}</div>`}
function selected(m){const v=$('teamFilter').value;return !v||String(m.a)===v||String(m.b)===v}
function groupMatches(){const c=state.config||{},courts=Number(c.courtCount)||6,perRound=Math.ceil(state.teams.length/2/courts),slot=(Number(c.groupMinutes)||12)+(Number(c.rotationMinutes)||3),[hh,mm]=(c.start||'09:30').split(':').map(Number),start=hh*60+mm;return (state.rounds||[]).flatMap((round,i)=>round.map((m,j)=>({m,round:i+1,at:start+(i*perRound+(Number(m.wave)||Math.floor(j/courts)+1)-1)*slot,terrain:(Number(m.court)||0)+1}))).sort((a,b)=>a.at-b.at)}
function renderMatches(){const rows=groupMatches().filter(x=>selected(x.m));return `<section class="panel"><h2>Journées de classement</h2>${rows.length?rows.map(x=>card(x.m,`Journée ${x.round} · ${time(x.at)} · Terrain ${x.terrain}`)).join(''):'<p class="muted">Aucune rencontre à afficher.</p>'}</section>`}
function renderRank(){const r=ranking(),v=$('teamFilter').value;return `<section class="panel"><h2>Classement général</h2><table><thead><tr><th>#</th><th>Équipe</th><th class="num">MJ</th><th class="num">Pts</th><th class="num">Diff.</th></tr></thead><tbody>${r.filter(x=>!v||String(x.id)===v).map(x=>`<tr><td>${r.indexOf(x)+1}</td><td>${esc(x.name)}</td><td class="num">${x.p}</td><td class="num">${x.pts}</td><td class="num">${x.gf-x.ga}</td></tr>`).join('')}</tbody></table></section>`}
function renderFinals(){if(!state.finals?.leagues)return '<section class="panel"><h2>Phases finales</h2><p>Les tableaux seront publiés après les journées de classement.</p></section>';const labels={q0:'Quart 1',q1:'Quart 2',q2:'Quart 3',q3:'Quart 4',w0:'Demi 1',w1:'Demi 2',l0:'Classement A',l1:'Classement B',first:'Finale',third:'3e / 4e',fifth:'5e / 6e',seventh:'7e / 8e'};return groups.filter(([key])=>state.finals.leagues[key]).map(([key,label,cls])=>`<section class="panel"><h2>Tableau ${label}</h2>${Object.entries(labels).filter(([id])=>state.finals.leagues[key][id]).filter(([id])=>selected(state.finals.leagues[key][id])).map(([id,l])=>card(state.finals.leagues[key][id],l,cls)).join('')||'<p class="muted">Aucun match pour cette équipe.</p>'}</section>`).join('')}
function renderSchedule(){return `<section class="panel"><h2>Planning des journées</h2>${groupMatches().filter(x=>selected(x.m)).map(x=>card(x.m,`${time(x.at)} · Terrain ${x.terrain} · Journée ${x.round}`)).join('')||'<p class="muted">Aucun match.</p>'}</section><section class="panel"><p class="muted">Les horaires des phases finales sont prévisionnels : confirmez-les auprès de l'organisation.</p></section>`}
function draw(){if(!state)return;const filter=$('teamFilter'),old=filter.value;filter.innerHTML='<option value="">Toutes les équipes</option>'+state.teams.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join('');filter.value=old;$('title').textContent=state.title||'Tournoi FC Montmorency';document.documentElement.style.setProperty('--club-color',state.clubColor||'#99122f');const nav=[['matchs','Matchs'],['classement','Classement'],['finales','Finales'],['planning','Planning']];$('nav').innerHTML=nav.map(([k,l])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';draw()">${l}</button>`).join('');$('content').innerHTML=({matchs:renderMatches,classement:renderRank,finales:renderFinals,planning:renderSchedule}[tab])()}
async function load(){if(!LIVE.url||!LIVE.anonKey){$('status').innerHTML='<div class="warn">La diffusion en direct n’est pas encore activée. L’organisateur doit configurer la synchronisation.</div>';return}try{const u=LIVE.url.replace(/\/$/,'')+'/rest/v1/tournaments?id=eq.main&select=payload,updated_at';const r=await fetch(u,{headers:{apikey:LIVE.anonKey,Authorization:'Bearer '+LIVE.anonKey},cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const x=await r.json();if(!x?.[0]?.payload)throw Error('Aucun tournoi publié');const s=x[0].payload;if(!Array.isArray(s.teams)||!Array.isArray(s.rounds)||s.teams.length>32)throw Error('Données invalides');state=s;lastUpdate=x[0].updated_at;draw();$('status').innerHTML='<span class="pill">● Résultats publiés</span> <span class="muted">Mise à jour : '+new Date(lastUpdate).toLocaleString('fr-FR')+'</span>'}catch(e){$('status').innerHTML='<div class="warn">Impossible de charger les résultats : '+esc(e.message)+'. Nouvelle tentative automatique.</div>'}}load();setInterval(load,20000);
</script></body></html>
